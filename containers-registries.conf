# Конфигурация реестров контейнеров для Podman
# Скопируйте в ~/.config/containers/registries.conf или /etc/containers/registries.conf

# Unqualified registries - реестры для коротких имён образов
unqualified-search-registries = ["docker.io", "quay.io", "registry.fedoraproject.org", "registry.access.redhat.com"]

