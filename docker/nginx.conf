# Nginx конфигурация для TenderTrack Frontend
# - Раздача статики
# - Проксирование API на backend
# - Проксирование WebSocket
# - SPA fallback

# Gzip сжатие
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# Кэш для статики
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   1d;
    application/javascript     1d;
    image/svg+xml              7d;
    ~font/                     30d;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Безопасность заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Проксирование REST API на backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Проксирование WebSocket на backend
    location /ws {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket таймауты (долгие соединения)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Корневой WebSocket (TenderTrack использует /)
    location = / {
        # Только для WebSocket upgrade
        if ($http_upgrade = "websocket") {
            proxy_pass http://backend:3001;
        }
        # Иначе отдаём index.html
        try_files $uri $uri/ /index.html;
    }

    # Статические файлы с кэшированием
    location /assets/ {
        expires $expires;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — все остальные запросы на index.html
    location / {
        expires $expires;
        try_files $uri $uri/ /index.html;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
